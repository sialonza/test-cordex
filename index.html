<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプルAIフォーマッター</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.12), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(14, 165, 233, 0.14), transparent 40%),
        var(--bg);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(880px, 100%);
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0.01em;
    }

    p {
      margin: 0 0 18px;
      color: #cbd5e1;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    button {
      margin-top: 14px;
      background: linear-gradient(120deg, var(--accent), var(--accent-strong));
      color: #0b1224;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 12px 35px rgba(56, 189, 248, 0.35);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 16px 40px rgba(56, 189, 248, 0.45);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.55);
      min-height: 72px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 12px;
    }

    .share {
      margin: 18px 0 24px;
      padding: 14px 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .share-label {
      font-weight: 700;
      color: #e2e8f0;
    }

    .share-row {
      display: flex;
      gap: 8px;
    }

    .share-row input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      font-size: 14px;
    }

    .share-row input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .share .ghost {
      margin-top: 0;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      box-shadow: none;
      padding: 10px 14px;
    }

    .share .ghost:hover:not(:disabled) {
      transform: none;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
    }

    .share-hint {
      color: #cbd5e1;
      font-size: 13px;
    }

    .helper {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="badge" aria-label="mocked AI notice">AI フォーマット (サンプル)</div>
    <h1>テキスト整形アプリ</h1>
    <p>GitHub Pages に配置するだけで動くシングルページデモです。デプロイ後は、下の公開 URL をそのまま共有できます。</p>

    <div class="share">
      <div class="share-label">公開URL（GitHub Pages にデプロイ後、このリンクを共有）</div>
      <div class="share-row">
        <input id="public-url" type="text" readonly aria-label="公開URL" />
        <button id="copy-url" class="ghost">コピー</button>
      </div>
      <div class="share-hint">Pages が有効化された後に表示される URL 例: https://&lt;GitHubユーザー名&gt;.github.io/&lt;リポジトリ名&gt;/</div>
    </div>

    <p class="helper">
      入力ボックスに自由入力し、**送信** ボタンまたは `⌘/Ctrl + Enter` で送信してください。ページ内でのみ動作し、外部 API には送信しません。
    </p>

    <label for="text-input">入力テキスト</label>
    <textarea id="text-input" placeholder="例） こんにちは！この文章を読みやすくしてください。"></textarea>

    <button id="send-btn">送信</button>
    <div class="status" id="status" aria-live="polite"></div>

    <div class="result" id="result" aria-live="polite">ここに結果が表示されます。</div>
  </main>

  <script>
    const inputEl = document.getElementById("text-input");
    const buttonEl = document.getElementById("send-btn");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");
    const publicUrlEl = document.getElementById("public-url");
    const copyUrlBtn = document.getElementById("copy-url");

    const mockAiFormat = (text) => {
      const normalized = text
        .trim()
        .replace(/\s+/g, " ")
        .replace(/\s*([。！？!?.])\s*/g, "$1 ")
        .replace(/\s*,\s*/g, ", ")
        .replace(/\s*\n\s*/g, "\n")
        .trim();

      const sentences = normalized
        .split(/(?<=[。!?！?])\s+/)
        .map((sentence) => {
          const trimmed = sentence.trim();
          if (!trimmed) return "";
          return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
        })
        .filter(Boolean);

      const bulletized = sentences.map((s) => `• ${s}`).join("\n");

      return bulletized || "入力が空です。テキストを入力してください。";
    };

    const setLoading = (isLoading) => {
      buttonEl.disabled = isLoading;
      buttonEl.textContent = isLoading ? "送信中..." : "送信";
      statusEl.textContent = isLoading ? "AI がテキストを整形しています..." : "";
    };

    const sendToAi = () => {
      const userText = inputEl.value;
      if (!userText.trim()) {
        resultEl.textContent = "テキストを入力してください。";
        return;
      }

      setLoading(true);
      resultEl.textContent = "";

      window.setTimeout(() => {
        const formatted = mockAiFormat(userText);
        resultEl.textContent = formatted;
        statusEl.textContent = "整形が完了しました。";
        setLoading(false);
      }, 450);
    };

    buttonEl.addEventListener("click", sendToAi);
    inputEl.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        sendToAi();
      }
    });

    const derivePublicUrl = () => {
      const pathSegments = window.location.pathname
        .split("/")
        .filter(Boolean);
      const repoName = pathSegments[0] || "test-cordex";

      if (window.location.hostname && window.location.protocol.startsWith("http")) {
        return window.location.href;
      }

      return `https://<GitHubユーザー名>.github.io/${repoName}/`;
    };

    const setPublicUrl = () => {
      publicUrlEl.value = derivePublicUrl();
    };

    const copyUrl = async () => {
      try {
        await navigator.clipboard.writeText(publicUrlEl.value);
        copyUrlBtn.textContent = "コピー済み";
        window.setTimeout(() => {
          copyUrlBtn.textContent = "コピー";
        }, 1400);
      } catch (error) {
        copyUrlBtn.textContent = "コピー失敗";
        window.setTimeout(() => {
          copyUrlBtn.textContent = "コピー";
        }, 1400);
      }
    };

    copyUrlBtn.addEventListener("click", copyUrl);
    setPublicUrl();
  </script>
</body>
</html>
